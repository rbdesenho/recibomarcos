<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R E C I B O</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/css/bootstrap.min.css"
  />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      padding: 20px;
      background: #fff;
    }

    .recibo-container {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      border: 1px solid #ddd;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      position: relative;
      display: none;
    }

    .recibo-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #00a6b5;
      padding-bottom: 10px;
    }

    .recibo-header img {
      width: 100px;
      margin-right: 20px;
    }

    .recibo-header .title {
      font-size: 24px;
      font-weight: bold;
      color: #555;
      margin: 0;
    }

    .recibo-header .valor-box {
      margin-left: auto;
      background: #eee;
      padding: 8px 15px;
      border-radius: 4px;
      text-align: right;
      font-size: 18px;
      font-weight: bold;
    }

    .recibo-linha {
      margin: 15px 0;
      display: flex;
      align-items: baseline;
    }

    .recibo-linha label {
      font-weight: bold;
      min-width: 180px;
      margin-right: 10px;
    }

    .recibo-linha .content {
      flex-grow: 1;
      border-bottom: 1px solid #999;
      padding: 2px 5px;
      font-size: 14px;
      line-height: 1.4;
    }

    .recibo-linha .content.highlight {
      background: #e6f2ff;
      font-weight: bold;
    }

    .recibo-footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .assinatura {
      margin-top: 20px;
      text-align: center;
      font-style: italic;
      font-weight: bold;
      font-size: 16px;
      padding-top: 10px;
      border-top: 1px dashed #999;
    }

    .cpf {
      font-size: 12px;
      font-weight: normal;
      margin-top: 3px;
    }

    .no-print {
      display: block;
    }

    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .recibo-container {
        box-shadow: none !important;
        border: none !important;
        padding: 20px !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Formulário -->
  <div class="container no-print" id="formContainer">
    <div align="center">
      <img src="imagens/logomarcos.jpg" width="200px" alt="LOGO" />
    </div>
    <h1>RECIBO</h1>
    <form class="form-horizontal" id="reciboForm" role="form">
      <div class="form-group">
        <label class="control-label col-sm-3">Recebi(emos) de</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" name="origem" required />
        </div>
      </div>
      <div class="form-group">
        <label class="control-label col-sm-3">Valor</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" name="valor" required />
        </div>
      </div>
      <div class="form-group">
        <label class="control-label col-sm-3">Referente a(o)</label>
        <div class="col-sm-9">
          <textarea class="form-control" name="referente" rows="2" required></textarea>
        </div>
      </div>
      <div class="form-group">
        <label class="control-label col-sm-3">Data</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" name="data" required />
        </div>
      </div>
      <div class="form-group">
        <div class="col-md-12 text-right">
          <button type="submit" class="btn btn-primary">Criar Recibo</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Recibo Gerado -->
  <div class="recibo-container" id="reciboContainer">
    <div class="recibo-header">
      <img src="imagens/recibomarcos.png" alt="Logo" />
      <h1 class="title">RECIBO</h1>
      <div class="valor-box" id="reciboValorBox">R$ <span id="reciboValor">0,00</span></div>
    </div>

    <div class="recibo-linha">
      <label>Recebi(emos) de</label>
      <div class="content" id="reciboOrigem"></div>
    </div>

    <div class="recibo-linha">
      <label>A importância de</label>
      <div class="content highlight" id="reciboExtenso"></div>
    </div>

    <div class="recibo-linha">
      <label>Referente a(o)</label>
      <div class="content" id="reciboReferente"></div>
    </div>

    <div class="recibo-footer">
      para clareza firmo(amos) o presente.
    </div>

    <div class="assinatura" id="reciboAssinatura">
      Francisco Marcos da Silva Dantas
    </div>
    <div class="cpf" id="reciboCpf">
      C.P.F.: 738.135.323-72
    </div>

    <div class="text-center no-print" style="margin-top: 30px;">
      <button class="btn btn-default" onclick="window.print()">Imprimir</button>
      <button class="btn btn-primary" onclick="gerarPDF()">Salvar como PDF</button>
      <button class="btn btn-link" onclick="voltarForm()">Voltar</button>
    </div>
  </div>

  <footer class="no-print">
    <hr />
    <div class="copyright">
      Desenvolvido por
      <a href="https://ronaldo1972.com.br" target="_blank">Ronaldo1972</a>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // Formatação dos campos
    $(document).ready(function () {
      $('input[name=valor]').mask('#.##0,00', { reverse: true });
      $('input[name=data]').mask('00/00/0000');

      const hoje = new Date();
      const dataFormatada = String(hoje.getDate()).padStart(2, '0') + '/' +
                            String(hoje.getMonth() + 1).padStart(2, '0') + '/' +
                            hoje.getFullYear();
      $('input[name=data]').val(dataFormatada);
    });

    // Função para converter valor em extenso (JavaScript)
    function valorPorExtenso(valor) {
      let num = valor.replace(/\D/g, '');
      if (!num || num === '0') return 'zero';
      if (num.length === 1) num = '00' + num;
      if (num.length === 2) num = '0' + num;
      const inteiro = Math.floor(parseInt(num) / 100);
      const centavos = parseInt(num) % 100;

      if (inteiro === 0 && centavos === 0) return 'zero';

      const unidade = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
      const dez = ["", "dez", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
      const dezE = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
      const centena = ["", "cem", "duzentos", "trezentos", "quatrocentos", "quinhentos", "seiscentos", "setecentos", "oitocentos", "novecentos"];

      function extensoNum(n) {
        if (n === 0) return "";
        let resultado = "";
        const c = Math.floor(n / 100);
        const d = Math.floor((n % 100) / 10);
        const u = n % 10;

        if (c === 1 && d === 0 && u === 0) {
          resultado = "cem";
        } else {
          if (c > 0) resultado += centena[c] + (d || u ? " e " : "");
          if (d === 1) {
            resultado += dezE[u];
          } else {
            if (d > 0) resultado += dez[d] + (u ? " e " : "");
            if (u > 0) resultado += unidade[u];
          }
        }
        return resultado;
      }

      function extensoGrupo(valor, escala) {
        if (valor === 0) return "";
        let txt = extensoNum(valor);
        if (escala === 0) {
          if (valor === 1) txt += " real";
          else txt += " reais";
        } else if (escala === 1) {
          if (valor === 1) txt += " mil";
          else txt += " mil";
        }
        return txt;
      }

      if (inteiro === 0) {
        let c = centavos === 1 ? " centavo" : " centavos";
        return unidade[centavos] + c;
      }

      let partes = [];
      let temp = inteiro;
      let escala = 0;

      while (temp > 0) {
        let grupo = temp % 1000;
        if (grupo > 0) {
          let parte = extensoGrupo(grupo, escala);
          if (escala === 1 && inteiro < 2000) parte = "mil";
          partes.unshift(parte);
        }
        temp = Math.floor(temp / 1000);
        escala++;
      }

      let textoInteiro = partes.join(" e ");
      let textoFinal = textoInteiro;

      if (centavos > 0) {
        let c = centavos === 1 ? " centavo" : " centavos";
        let cent = unidade[centavos] || (centavos < 20 ? dezE[centavos - 10] : dez[Math.floor(centavos / 10)] + (centavos % 10 ? " e " + unidade[centavos % 10] : ""));
        textoFinal += " e " + cent + c;
      }

      return textoFinal;
    }

    // Função para formatar data por extenso
    function dataPorExtenso(dataStr) {
      const partes = dataStr.split('/');
      if (partes.length !== 3) return dataStr;
      const dia = parseInt(partes[0]);
      const mesNum = parseInt(partes[1]) - 1;
      const ano = partes[2];
      const meses = [
        "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
        "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
      ];
      return `${dia} de ${meses[mesNum]} de ${ano}`;
    }

    // Submit do formulário
    document.getElementById('reciboForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const origem = this.origem.value.trim();
      const valor = this.valor.value.trim();
      const referente = this.referente.value.trim();
      const data = this.data.value.trim();

      // Preenche recibo
      document.getElementById('reciboValor').textContent = valor;
      document.getElementById('reciboOrigem').textContent = origem;
      document.getElementById('reciboExtenso').textContent = valorPorExtenso(valor);
      document.getElementById('reciboReferente').textContent = referente;

      // Data completa
      const dataExtensa = dataPorExtenso(data);
      document.querySelector('.recibo-footer').innerHTML = `para clareza firmo(amos) o presente.<br><br><strong>Fortaleza, ${dataExtensa}</strong>`;

      // Mostra recibo
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('reciboContainer').style.display = 'block';
    });

    function voltarForm() {
      document.getElementById('formContainer').style.display = 'block';
      document.getElementById('reciboContainer').style.display = 'none';
    }

    // Gerar PDF
    async function gerarPDF() {
      const { jsPDF } = window.jspdf;
      const recibo = document.getElementById('reciboContainer');

      const canvas = await html2canvas(recibo, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#fff'
      });

      const imgData = canvas.toDataURL('image/png');
      const pdf = new jsPDF('p', 'mm', 'a4');
      const imgWidth = 210;
      const pageHeight = 297;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      let heightLeft = imgHeight;
      let position = 0;

      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft >= 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      pdf.save('recibo.pdf');
    }
  </script>
</body>
</html>
